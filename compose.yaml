services:
  client:
    build: ./client
    ports: 
    - "5173:5173"
    develop:
      watch:
        - action: sync+restart
          path: ./client
          target: /code
        - action: rebuild
          path: ./client/package.json 

  backend:
    build: ./backend
    ports:
    - "${PORT}:3000"
    env_file:
    - .env
    environment:
    - NODE_ENV=${NODE_ENV}
    - WEATHER_API_KEY=${WEATHER_API_KEY}
    - REDIS_URL=${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /code
        - action: rebuild
          path: ./backend/package.json  
    
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data: